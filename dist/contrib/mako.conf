# Mako notification daemon configuration for GriddyWM
# Place in ~/.config/mako/config
#
# Install mako:  pacman -S mako  /  dnf install mako
# Start via:     [startup] exec = ["mako"] in config.toml

[config]
# Anchor to the top-right corner, below the waybar strip.
anchor=top-right
margin=8
padding=12

# Dimensions
width=340
height=130
max-visible=5

# Timing
default-timeout=5000
ignore-timeout=0

# Font (change to your preferred monospace or sans-serif)
font=Inter 11

# Colors — matches GriddyWM default theme
background-color=#1a1b26ee
text-color=#c0caf5
border-color=#7aa2f7
border-radius=6
border-size=1

# Urgency-specific overrides
[urgency=low]
border-color=#565f89

[urgency=high]
border-color=#f7768e
default-timeout=0
