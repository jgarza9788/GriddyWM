[workspace]
members = [
    "griddy",
    "griddyctl",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/griddywm/griddywm"

[workspace.dependencies]
# Smithay compositor framework
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "desktop",
    "renderer_gl",
    "renderer_pixman",
    "renderer_multi",
    "xwayland",
    "wayland_frontend",
] }

# Event loop
calloop = { version = "0.14", features = ["signals"] }

# Wayland
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["unstable", "staging", "server"] }
wayland-protocols-wlr = { version = "0.3", features = ["server"] }

# Config
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# IPC
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
indexmap = "2"
bitflags = "2"
libloading = "0.8"
regex = "1"
