[package]
name = "griddy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GriddyWM — grid-based Wayland compositor"

[[bin]]
name = "griddy"
path = "src/main.rs"

[features]
default = ["xwayland", "plugin-abi"]
xwayland = ["smithay/xwayland"]
plugin-abi = ["dep:libloading"]

[dependencies]
smithay.workspace = true
calloop.workspace = true
wayland-server.workspace = true
wayland-protocols.workspace = true
wayland-protocols-wlr.workspace = true
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
anyhow.workspace = true
thiserror.workspace = true
indexmap.workspace = true
bitflags.workspace = true

regex.workspace = true
nix = { version = "0.29", features = ["fs", "process", "signal"] }
xkbcommon = { version = "0.8", features = ["wayland"] }
drm-fourcc = "2"
winit = { version = "0.30", features = ["wayland", "x11"] }
libloading = { workspace = true, optional = true }
